    <style>

        #page-description { background: url('foto.webp') no-repeat center center; background-size: cover; position: relative; }
        #page-description::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(200,230,255,0.7); z-index: -1; }

        .lang-btn-3d {
            position: absolute; top: 20px; right: 20px;
            padding: 12px 24px; font-size: 16px; font-weight: 800;
            color: #2a5a8a; background: rgba(255,255,255,0.5);
            -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);

        .glass-btn-3d { position: relative; padding: 18px 48px; font-size: 18px; font-weight: 800; color: #2a5a8a; background: rgba(255,255,255,0.6); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(100,180,255,0.5); border-radius: 20px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25,0.8,0.25,1); box-shadow: 0 8px 32px rgba(100,180,255,0.3), inset 0 1px 0 rgba(255,255,255,0.8), inset 0 -2px 0 rgba(0,0,0,0.1), 0 0 40px rgba(100,180,255,0.2); text-transform: uppercase; letter-spacing: 1.5px; overflow: hidden; margin: 12px; z-index: 1; animation: glassPulse 3s ease-in-out infinite; touch-action: manipulation; }
        .glass-btn-3d::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4) 0%, transparent 60%); pointer-events: none; mix-blend-mode: overlay; animation: shineMove 6s linear infinite; }

        @keyframes shineMove { 0% { transform: translate(-20%,-20%) rotate(0deg); } 100% { transform: translate(20%,20%) rotate(10deg); } }
        @keyframes glassPulse { 0%,100% { box-shadow: 0 8px 32px rgba(100,180,255,0.3), inset 0 1px 0 rgba(255,255,255,0.8), 0 0 40px rgba(100,180,255,0.2); border-color: rgba(100,180,255,0.5); } 50% { box-shadow: 0 8px 48px rgba(100,180,255,0.5), inset 0 1px 0 rgba(255,255,255,1), 0 0 70px rgba(100,180,255,0.4); border-color: rgba(100,200,255,0.8); } }

        .support-block { width: 100%; max-width: 95vw; background: rgba(255,255,255,0.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(100,180,255,0.3); border-radius: 30px; padding: 10px 20px; z-index: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; font-size: 13px; color: #5a7a9a; text-align: center; margin-top: 20px; }

        #game-hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 50; flex-wrap: wrap; gap: 10px; }

        @keyframes snakeGlow {
            from { filter: drop-shadow(0 0 20px rgba(0,255,100,0.6)); transform: scale(1); }
            to { filter: drop-shadow(0 0 45px rgba(0,255,150,1)) drop-shadow(0 0 80px rgba(0,200,80,0.5)); transform: scale(1.08); }
        }
        .reward-text { font-size: clamp(18px, 4vw, 26px); color: #0a8a4a; font-weight: 800; text-shadow: 0 0 15px rgba(0,255,100,0.5); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .confetti { position: fixed; top: -10px; z-index: 9999; pointer-events: none; border-radius: 2px; }

        #touch-controls { position: absolute; bottom: 90px; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center; padding: 0 12px; z-index: 55; pointer-events: none; flex-wrap: wrap; gap: 6px; }
        #touch-controls > div { pointer-events: auto; display: flex; gap: 8px; align-items: center; }

        @media (max-width:700px) {
            .hud-panel { font-size: 13px; padding: 8px 14px; }
            .hud-timer { font-size: 18px; }
            .glass-btn-3d { padding: 14px 32px; font-size: 16px; margin: 8px; }
            .lang-btn-3d { top: 15px; right: 15px; padding: 10px 18px; font-size: 14px; }
            .voice-test-btn { top: 15px; left: 15px; padding: 8px 14px; font-size: 11px; }
            .touch-btn { font-size: 22px !important; padding: 10px 16px !important; min-width: 54px; min-height: 54px; }
            #touch-controls { bottom: 80px; padding: 0 6px; gap: 4px; }
            .support-block { font-size: 11px; padding: 8px 14px; }
        }

        @media (max-width: 400px) {
            .glass-btn-3d { padding: 12px 24px; font-size: 14px; }
            .title-main { margin-bottom: 8px; }

        @media (max-height: 500px) and (orientation: landscape) {
            .page { padding: 10px; }
            .title-main { font-size: 32px; margin-bottom: 8px; }
            .subtitle { font-size: 14px; margin-bottom: 10px; }
            .support-block { display: none; }
            #touch-controls { bottom: 20px; }
            .hud-timer { font-size: 20px; }
        }
    </style>
</head>
<body>

<div id="page-description" class="page active">

<script>
// ===== ПРОВЕРКА ПОДДЕРЖКИ WebGL =====
(function() {
    try {
        var c = document.createElement('canvas');
        var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
        if (!gl) {
            document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;"><h1>⚠️</h1><p>Ваш браузер не поддерживает WebGL. Обновите браузер или устройство.</p></div>';
            throw new Error('WebGL not supported');
        }
    } catch(e) { throw e; }
})();

// ===== ПРОВЕРКА, ЧТО THREE ЗАГРУЗИЛСЯ =====
if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;"><h1>⚠️</h1><p>Не удалось загрузить движок игры (Three.js). Проверьте соединение с интернетом и обновите страницу.</p></div>';
    throw new Error('THREE not loaded');
}

// ===== ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО / СЛАБОГО УСТРОЙСТВА =====
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

function detectLowEnd() {
    try {
        const ua = navigator.userAgent || '';
        if (/Android [1-7]\./.test(ua)) return true;
        if (/iPhone OS [1-9]_|iPhone OS 1[0-2]_/.test(ua)) return true;
        if (/Windows Phone/.test(ua)) return true;
        if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) return true;
        if (navigator.deviceMemory && navigator.deviceMemory < 2) return true;
    } catch(e) {}
    return false;
}
const IS_LOW_END = detectLowEnd();
console.log('📱 Устройство:', isMobile ? 'мобильное' : 'десктоп', '|', IS_LOW_END ? 'слабое (облегчённая графика)' : 'мощное (полная графика)');

THREE.OrbitControls = function(object, domElement) {
    this.object = object;
    this.domElement = domElement;
    this.enabled = true;
    this.target = new THREE.Vector3();
    this.enableDamping = true;
    this.dampingFactor = 0.08;
    this.enableZoom = false;
    this.enableRotate = false;
    this.enablePan = false;
    this.update = function() {
        this.object.lookAt(this.target);
    };
};

console.log('🎮 Игра "Змея и Лабиринт" загружается...');

// ===== ПЕРЕВОДЫ =====
const MAIN_LEADERBOARD_URL = "https://anti-ii-zmeya-vse-igry.vercel.app/";
const GAME_NAME_FOR_BOARD = "🐍 - 🧩 Змея и Лабиринт";
const REWARD_SNAKES_ON_WIN = 1;

let currentLang = 'ru';

const translations = {
    ru: {

// ===== TTS =====
let ttsUnlocked = false;
let cachedVoice = null;
let speakCounter = 0;

function warmUpTTS() {
    if (!('speechSynthesis' in window)) return;
    const pickVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return;
        const prefix = currentLang === 'ru' ? 'ru' : 'en';
        cachedVoice =
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix) && v.localService) ||
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix)) ||
            null;
        console.log('🎙️ Голос для', currentLang, ':', cachedVoice ? cachedVoice.name + ' (' + cachedVoice.lang + ')' : 'по умолчанию');
    };
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
}
warmUpTTS();

function unlockTTS() {
    if (ttsUnlocked || !('speechSynthesis' in window)) return;
    try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0.01;
        u.rate = 2;
        u.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
        window.speechSynthesis.speak(u);
        ttsUnlocked = true;
        console.log('🔊 TTS разблокирован');
    } catch(e) { console.warn('TTS unlock failed:', e); }
}

document.addEventListener('touchstart', unlockTTS, { once: true, passive: true });
document.addEventListener('click',      unlockTTS, { once: true });
document.addEventListener('keydown',    unlockTTS, { once: true });

function speakText(textKey) {
    if (!('speechSynthesis' in window)) {
        console.warn('⚠️ speechSynthesis не поддерживается');
        return;
    }
    const textToSpeak = translations[currentLang][textKey];
    if (!textToSpeak) {
        console.warn('⚠️ Отсутствует текст для озвучки ключа:', textKey);
        return;
    }
    const lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
    const myId = ++speakCounter;

    try {
        window.speechSynthesis.cancel();
        setTimeout(() => {
            if (myId !== speakCounter) return;
            try {
                const u = new SpeechSynthesisUtterance(textToSpeak);
                u.lang = lang;
                u.rate = 1.05;
                u.pitch = 1.0;
                u.volume = 1.0;

                // Fallback-поиск голоса: если кэш пуст — ищем свежий
                let voice = cachedVoice;
                if (!voice) {
                    const voices = window.speechSynthesis.getVoices();
                    const prefix = currentLang === 'ru' ? 'ru' : 'en';
                    voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix)) || null;
                    if (voice) cachedVoice = voice;
                }
                if (voice) u.voice = voice;

                console.log('🗣️ Говорю:', textToSpeak, '| голос:', u.voice ? u.voice.name : 'default');
                window.speechSynthesis.speak(u);
            } catch(e) { console.error('speak error:', e); }
        }, 80);
    } catch(e) { console.error('speakText error:', e); }
}

function createSignedToken(game, snakes) {
    const nonce = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const timestamp = Date.now();
    const data = { g: game, s: snakes, t: timestamp, n: nonce };
    const sig = btoa(unescape(encodeURIComponent(
        data.g + '|' + data.s + '|' + data.t + '|' + data.n + '|AntonKuznetsovSnakeProject2026'
    )));
    data.sig = sig;
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch(e) {}
    }
}
function playTone(f, d, type='sine', vol=0.3) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
function playWinSound() {
    initAudio(); if (!audioCtx) return;
    [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,0.15,'sine',0.3),i*100));

const MAZE_SIZE = 27;
const CELL_SIZE = 3;
const MAZE_OFFSET = (MAZE_SIZE * CELL_SIZE) / 2;
let mazeGrid = [];
let walls = [];
let wallGrid = [];
let exitBeacon = null;

// Хранилища для dispose (предотвращаем утечку памяти)
let sharedWallGeo = null, sharedWallMat = null;
let sharedFloorGeo = null, sharedFloorMat = null;
let currentFloor = null;
let currentExitTile = null;
let exitBeamMesh = null;
let exitBeamMat = null;
let exitParticles = null;

function disposeMazeResources() {
    // Удаляем все стены со сцены
    walls.forEach(w => scene.remove(w));
    walls = [];

    // Освобождаем общие ресурсы стен (один раз вместо 729 вызовов)
    if (sharedWallGeo) { sharedWallGeo.dispose(); sharedWallGeo = null; }
    if (sharedWallMat) { sharedWallMat.dispose(); sharedWallMat = null; }

    // Пол
    if (currentFloor) {
        scene.remove(currentFloor);
        if (currentFloor.geometry) currentFloor.geometry.dispose();
        if (currentFloor.material) currentFloor.material.dispose();
        currentFloor = null;
    }
    if (sharedFloorGeo) { sharedFloorGeo.dispose(); sharedFloorGeo = null; }
    if (sharedFloorMat) { sharedFloorMat.dispose(); sharedFloorMat = null; }

    // Плитка выхода
    if (currentExitTile) {
        scene.remove(currentExitTile);
        if (currentExitTile.geometry) currentExitTile.geometry.dispose();
        if (currentExitTile.material) currentExitTile.material.dispose();
        currentExitTile = null;
    }

    // Маяк выхода (beacon + beam + light + particles)
    if (exitBeacon) {
        scene.remove(exitBeacon);
        if (exitBeamMesh) {
            exitBeamMesh.geometry.dispose();
            if (exitBeamMat) { exitBeamMat.dispose(); exitBeamMat = null; }
            exitBeamMesh = null;
        }
        if (exitParticles) {
            exitParticles.geometry.dispose();
            if (exitParticles.material) exitParticles.material.dispose();
            exitParticles = null;
        }
        if (exitBeacon.geometry) exitBeacon.geometry.dispose();
        if (exitBeacon.material) exitBeacon.material.dispose();
        exitBeacon = null;
    }
}

function buildWallGrid() {
    const gridSize = MAZE_SIZE * 2 + 4;
    wallGrid = Array(gridSize).fill().map(() => Array(gridSize).fill(false));
    for (let w of walls) {
        const gridX = Math.round((w.position.x + MAZE_OFFSET) / (CELL_SIZE / 2));
        const gridZ = Math.round((w.position.z + MAZE_OFFSET) / (CELL_SIZE / 2));
        if (gridX >= 0 && gridX < gridSize && gridZ >= 0 && gridZ < gridSize) {
            wallGrid[gridX][gridZ] = true;
        }
    }
}

function generateMaze() {
    // ===== ПОЛНАЯ ОЧИСТКА ПАМЯТИ =====
    disposeMazeResources();

    mazeGrid = Array(MAZE_SIZE).fill().map(() => Array(MAZE_SIZE).fill(1));
    const stack = [];
    const startX = 1, startY = 1;
    mazeGrid[startY][startX] = 0;
    stack.push({x: startX, y: startY});
    const directions = [{dx: 0, dy: -2}, {dx: 0, dy: 2}, {dx: -2, dy: 0}, {dx: 2, dy: 0}];
    
    while (stack.length > 0) {
        const current = stack[stack.length - 1];
        const neighbors = [];
        for (let dir of directions) {
            const nx = current.x + dir.dx, ny = current.y + dir.dy;
            if (nx > 0 && nx < MAZE_SIZE - 1 && ny > 0 && ny < MAZE_SIZE - 1 && mazeGrid[ny][nx] === 1) {
                neighbors.push({x: nx, y: ny, dx: dir.dx, dy: dir.dy});
            }
        }
        if (neighbors.length > 0) {
            const chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
            mazeGrid[chosen.y][chosen.x] = 0;
            mazeGrid[current.y + chosen.dy / 2][current.x + chosen.dx / 2] = 0;
            stack.push({x: chosen.x, y: chosen.y});
        } else {
            stack.pop();
        }
    }
    
    const candidates = [];
    let maxDist = 0;
    for (let y = 1; y < MAZE_SIZE - 1; y++) {
        for (let x = 1; x < MAZE_SIZE - 1; x++) {
            if (mazeGrid[y][x] === 0) {
                const d = Math.abs(x - startX) + Math.abs(y - startY);
                if (d > maxDist) maxDist = d;
                candidates.push({x, y, d});
            }
        }
    }
    const minD = Math.floor(maxDist * 0.55);
    let pool = candidates.filter(c => c.d >= minD);
    if (pool.length === 0) pool = candidates;
    const exitCell = pool[Math.floor(Math.random() * pool.length)];
    const exitX = exitCell.x, exitY = exitCell.y;

    const wallHeight = 1.3, wallY = -1.6 + wallHeight/2;

    // ===== ЛЁГКИЙ МАТЕРИАЛ НА СЛАБЫХ УСТРОЙСТВАХ (Lambert вместо Standard) =====
    sharedWallGeo = new THREE.BoxGeometry(CELL_SIZE, wallHeight, CELL_SIZE);
    sharedWallMat = IS_LOW_END
        ? new THREE.MeshLambertMaterial({ color: 0xeeeeff })
        : new THREE.MeshStandardMaterial({ color: 0xeeeeff, roughness: 0.4, metalness: 0.1 });
    
    for (let y = 0; y < MAZE_SIZE; y++) {
        for (let x = 0; x < MAZE_SIZE; x++) {
            if (mazeGrid[y][x] === 1) {
                const wall = new THREE.Mesh(sharedWallGeo, sharedWallMat);
                wall.position.set(x * CELL_SIZE - MAZE_OFFSET, wallY, y * CELL_SIZE - MAZE_OFFSET);
                wall.castShadow = !IS_LOW_END;
                wall.receiveShadow = !IS_LOW_END;
                scene.add(wall);
                walls.push(wall);
            }
        }
    }
    
    sharedFloorGeo = new THREE.PlaneGeometry(MAZE_SIZE * CELL_SIZE + 4, MAZE_SIZE * CELL_SIZE + 4);
    sharedFloorMat = IS_LOW_END
        ? new THREE.MeshLambertMaterial({ color: 0xddeeff })
        : new THREE.MeshStandardMaterial({ color: 0xddeeff, roughness: 0.6, metalness: 0.2 });
    currentFloor = new THREE.Mesh(sharedFloorGeo, sharedFloorMat);
    currentFloor.rotation.x = -Math.PI / 2;
    currentFloor.position.y = -1.6;
    currentFloor.receiveShadow = !IS_LOW_END;
    scene.add(currentFloor);

    // Плитка выхода — на слабых Basic, на мощных Standard
    const exitTileGeo = new THREE.PlaneGeometry(CELL_SIZE * 0.9, CELL_SIZE * 0.9);
    const exitTileMat = IS_LOW_END
        ? new THREE.MeshBasicMaterial({ color: 0x00ff44, transparent: true, opacity: 0.95 })
        : new THREE.MeshStandardMaterial({
            color: 0x00ff44, emissive: 0x00ff44, emissiveIntensity: 1.5,
            transparent: true, opacity: 0.95, roughness: 0.2, metalness: 0.1
        });
    currentExitTile = new THREE.Mesh(exitTileGeo, exitTileMat);
    currentExitTile.rotation.x = -Math.PI / 2;
    currentExitTile.position.set(exitX * CELL_SIZE - MAZE_OFFSET, -1.55, exitY * CELL_SIZE - MAZE_OFFSET);
    scene.add(currentExitTile);
    
    const beaconGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.2, IS_LOW_END ? 16 : 32);
    const beaconMat = new THREE.MeshBasicMaterial({ color: 0x00ff44, transparent: true, opacity: 1.0 });
    exitBeacon = new THREE.Mesh(beaconGeo, beaconMat);
    exitBeacon.position.set(exitX * CELL_SIZE - MAZE_OFFSET, -1.5, exitY * CELL_SIZE - MAZE_OFFSET);
    
    const beamGeo = new THREE.CylinderGeometry(0.7, 0.7, 40, IS_LOW_END ? 8 : 16, 1, true);
    exitBeamMat = new THREE.MeshBasicMaterial({ color: 0x00ff44, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false });
    exitBeamMesh = new THREE.Mesh(beamGeo, exitBeamMat);
    exitBeamMesh.position.y = 20;
    exitBeacon.add(exitBeamMesh);
    
    const beaconLight = new THREE.PointLight(0x00ff44, 8, 35);
    beaconLight.position.set(0, 2, 0);
    exitBeacon.add(beaconLight);
    
    if (!IS_LOW_END) {
        const particleCount = 60;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) pPos[i] = (Math.random() - 0.5) * 5;
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0x44ff88, size: 0.3, transparent: true, opacity: 1.0 });
        exitParticles = new THREE.Points(pGeo, pMat);
        exitBeacon.add(exitParticles);
        exitBeacon.userData = { particles: exitParticles, light: beaconLight, baseY: -1.5, beam: exitBeamMat, hasParticles: true };
    } else {
        exitBeacon.userData = { light: beaconLight, baseY: -1.5, beam: exitBeamMat, hasParticles: false };
    }
    
    scene.add(exitBeacon);
    buildWallGrid();
    return { startX: startX * CELL_SIZE - MAZE_OFFSET, startZ: startY * CELL_SIZE - MAZE_OFFSET };
}

const snakeBody = [];
const SPHERE_DETAIL = IS_LOW_END ? 12 : 24;

// ===== ЛЁГКИЙ МАТЕРИАЛ ДЛЯ ЗМЕИ НА СЛАБЫХ УСТРОЙСТВАХ =====
const bodyMatGlass = IS_LOW_END
    ? new THREE.MeshLambertMaterial({ color: 0xc82020, transparent: true, opacity: 0.85, emissive: 0x440000 })
    : new THREE.MeshStandardMaterial({ color: 0xc82020, roughness: 0.2, metalness: 0.8, transparent: true, opacity: 0.85, emissive: 0x880000, emissiveIntensity: 0.6 });

const baseRadii = [];
for (let i = 0; i < MAX_SEGMENTS; i++) {
    baseRadii.push(BASE_SEGMENT_RADIUS * (1 - (i / (MAX_SEGMENTS - 1)) * 0.7));
}
for (let i = 0; i < MAX_SEGMENTS; i++) {
    const geo = new THREE.SphereGeometry(baseRadii[i], SPHERE_DETAIL, SPHERE_DETAIL);
    const mesh = new THREE.Mesh(geo, bodyMatGlass.clone());
    mesh.castShadow = !IS_LOW_END;
    mesh.receiveShadow = false;
    snakeGroup.add(mesh);
    snakeBody.push(mesh);
    mesh.visible = i < activeSegments;
}

const headMat = IS_LOW_END
    ? new THREE.MeshLambertMaterial({ color: 0xe03030, transparent: true, opacity: 0.9, emissive: 0x660000 })
    : new THREE.MeshStandardMaterial({ color: 0xe03030, roughness: 0.2, metalness: 0.8, transparent: true, opacity: 0.85, emissive: 0xaa2222, emissiveIntensity: 0.8 });
const headGeo = new THREE.SphereGeometry(0.85, SPHERE_DETAIL + 12, SPHERE_DETAIL + 12);
headGeo.scale(1, 0.85, 1.45);
const head = new THREE.Mesh(headGeo, headMat);
head.castShadow = !IS_LOW_END;
snakeGroup.add(head);

const headLight = new THREE.PointLight(0xff6644, 3.0, 20);
headLight.position.set(0, 1.5, 2.5);
head.add(headLight);

function createEye(ox, oy, oz) {
    const g = new THREE.Group();
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshBasicMaterial({ color: 0xf8f8ff }));
    white.scale.set(1, 1.1, 0.9); g.add(white);
    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    iris.position.z = 0.16; iris.scale.set(1, 1.2, 0.5); g.add(iris);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    pupil.scale.set(0.5, 1.6, 0.4); pupil.position.z = 0.22; g.add(pupil);
    g.position.set(ox, oy, oz); return g;
}
head.add(createEye(-0.4, 0.35, 0.75));
head.add(createEye(0.4, 0.35, 0.75));

const HEAD_ATTACH = 0.9;
const segmentPositions = [];
for (let i = 0; i < MAX_SEGMENTS; i++) segmentPositions.push(new THREE.Vector3(-i * SEGMENT_SPACING, 0, 0));
const headPos = new THREE.Vector3(0, 0, 0);
let dirAngle = Math.PI / 2;
let targetAngle = Math.PI / 2;
const moveDir = new THREE.Vector3(1, 0, 0);
const BASE_SPEED = 5.0;
let speedMult = 1.0;

document.addEventListener('keydown', (e) => {
    if (!isGameActive || gameOver || e.repeat) return;
    let newAngle = null;
    if (e.key === 'ArrowLeft' || e.key === 'a') newAngle = dirAngle + Math.PI / 2;
    else if (e.key === 'ArrowRight' || e.key === 'd') newAngle = dirAngle - Math.PI / 2;
    else if (e.key === 'ArrowUp' || e.key === 'w') { speedMult = Math.min(2.0, speedMult + 0.5); e.preventDefault(); return; }
    else if (e.key === 'ArrowDown' || e.key === 's') { speedMult = Math.max(0.0, speedMult - 0.5); e.preventDefault(); return; }
    
    if (newAngle !== null) {
        targetAngle = Math.atan2(Math.sin(newAngle), Math.cos(newAngle));
        e.preventDefault();
    }
});

function setupTouchControls() {
    const btns = document.querySelectorAll('.touch-btn');
    const actions = {
        left: () => { targetAngle = dirAngle + Math.PI / 2; },
        right: () => { targetAngle = dirAngle - Math.PI / 2; },
        forward: () => { if (isGameActive && !gameOver) speedMult = Math.min(2.0, speedMult + 0.5); },
        backward: () => { if (isGameActive && !gameOver) speedMult = Math.max(0.0, speedMult - 0.5); }
    };
    btns.forEach(btn => {
        const action = btn.dataset.action;
        if (!action) return;
        const start = (e) => {
            e.preventDefault();
            if (!isGameActive || gameOver) return;
            if (actions[action]) actions[action]();
        };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); }, { passive: false });
        btn.addEventListener('touchcancel', (e) => { e.preventDefault(); }, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', (e) => e.preventDefault());
        btn.addEventListener('mouseleave', (e) => e.preventDefault());
    });
}
setTimeout(setupTouchControls, 100);

function checkWallCollision(newX, newZ) {
    const headRadius = 0.85;
    const wallHalfSize = CELL_SIZE / 2;
    const gridX = Math.round((newX + MAZE_OFFSET) / (CELL_SIZE / 2));
    const gridZ = Math.round((newZ + MAZE_OFFSET) / (CELL_SIZE / 2));
    const gridSize = MAZE_SIZE * 2 + 4;
    
    for (let di = -2; di <= 2; di++) {
        for (let dj = -2; dj <= 2; dj++) {
            const gi = gridX + di;
            const gj = gridZ + dj;
            if (gi < 0 || gi >= gridSize || gj < 0 || gj >= gridSize) continue;
            if (!wallGrid[gi] || !wallGrid[gi][gj]) continue;
            
            const wx = gi * (CELL_SIZE / 2) - MAZE_OFFSET;
            const wz = gj * (CELL_SIZE / 2) - MAZE_OFFSET;
            if (Math.abs(newX - wx) < (wallHalfSize + headRadius) && Math.abs(newZ - wz) < (wallHalfSize + headRadius)) {
                return true;
            }
        }
    }
    return false;
}

function pushSegmentOutOfWalls(x, z, radius) {
    let finalX = x, finalZ = z;
    const wallHalfSize = CELL_SIZE / 2;
    const minBound = -MAZE_OFFSET + CELL_SIZE + radius;
    const maxBound = MAZE_OFFSET - CELL_SIZE - radius;
    finalX = Math.max(minBound, Math.min(maxBound, finalX));
    finalZ = Math.max(minBound, Math.min(maxBound, finalZ));
    
    const gridX = Math.round((finalX + MAZE_OFFSET) / (CELL_SIZE / 2));
    const gridZ = Math.round((finalZ + MAZE_OFFSET) / (CELL_SIZE / 2));
    const gridSize = MAZE_SIZE * 2 + 4;
    
    for (let iter = 0; iter < 3; iter++) {
        let pushed = false;
        for (let di = -2; di <= 2; di++) {
            for (let dj = -2; dj <= 2; dj++) {
                const gi = gridX + di;
                const gj = gridZ + dj;
                if (gi < 0 || gi >= gridSize || gj < 0 || gj >= gridSize) continue;
                if (!wallGrid[gi] || !wallGrid[gi][gj]) continue;
                
                const wx = gi * (CELL_SIZE / 2) - MAZE_OFFSET;
                const wz = gj * (CELL_SIZE / 2) - MAZE_OFFSET;
                const dx = finalX - wx;
                const dz = finalZ - wz;
                const overlapX = (wallHalfSize + radius) - Math.abs(dx);
                const overlapZ = (wallHalfSize + radius) - Math.abs(dz);
                
                if (overlapX > 0 && overlapZ > 0) {
                    if (overlapX < overlapZ) finalX += (dx > 0 ? overlapX : -overlapX);
                    else finalZ += (dz > 0 ? overlapZ : -overlapZ);
                    pushed = true;
                }
            }
        }
        if (!pushed) break;
    }
    return { x: finalX, z: finalZ };
}

function updateTimerDisplay() {
    const m = Math.floor(gameTimeLeft / 60), s = Math.floor(gameTimeLeft % 60);
    const d = document.getElementById('timerDisplay');
    d.textContent = `⏱ ${m}:${s.toString().padStart(2, '0')}`;
    d.classList.toggle('warning', gameTimeLeft <= 30);
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (!isGameActive || gameOver) return;
        gameTimeLeft = Math.max(0, gameTimeLeft - 1);
        updateTimerDisplay();
        if (gameTimeLeft <= 0) { clearInterval(timerInterval); timerInterval = null; finishGame('time'); }
    }, 1000);
}

const clock = new THREE.Clock();
let lastFrame = 0;
const FPS_LIMIT = IS_LOW_END ? 30 : 60;
const FRAME_INTERVAL = 1000 / FPS_LIMIT;
const cameraTarget = new THREE.Vector3(0, 0, 0);
const snakeCenter = new THREE.Vector3();
let rafId = null;
let isPaused = false;

function animate(time) {
    if (isPaused) return;
    rafId = requestAnimationFrame(animate);
    if (time - lastFrame < FRAME_INTERVAL) return;
    lastFrame = time;
    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.elapsedTime;

    if (!isGameActive || gameOver) {
        controls.update();
        renderer.render(scene, camera);
        return;
    }

    if (exitBeacon) {
        exitBeacon.rotation.y += delta * 1.5;
        exitBeacon.position.y = exitBeacon.userData.baseY + Math.sin(elapsed * 2) * 0.2;
        exitBeacon.userData.light.intensity = 8 + Math.sin(elapsed * 3) * 2.0;
        exitBeacon.userData.beam.opacity = 0.22 + Math.sin(elapsed * 2.5) * 0.1;
        if (exitBeacon.userData.hasParticles && exitBeacon.userData.particles) {
            exitBeacon.userData.particles.rotation.y -= delta * 0.5;
        }
        
        const distToExit = Math.sqrt(Math.pow(headPos.x - exitBeacon.position.x, 2) + Math.pow(headPos.z - exitBeacon.position.z, 2));
        if (distToExit < 2.2) {
            playWinSound();
            speakText('ttsWin');
            finishGame('win');
            return;
        }
    }

    let angleDiff = targetAngle - dirAngle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    const maxTurn = delta * 5.0;
    if (Math.abs(angleDiff) > maxTurn) angleDiff = Math.sign(angleDiff) * maxTurn;
    dirAngle += angleDiff;

    moveDir.x = Math.cos(dirAngle);
    moveDir.z = Math.sin(dirAngle);

    const currentSpeed = BASE_SPEED * speedMult;
    let newX = headPos.x + moveDir.x * currentSpeed * delta;
    let newZ = headPos.z + moveDir.z * currentSpeed * delta;

    if (!checkWallCollision(newX, newZ)) {
        headPos.x = newX;
        headPos.z = newZ;
    } else {
        if (!checkWallCollision(newX, headPos.z)) headPos.x = newX;
        else if (!checkWallCollision(headPos.x, newZ)) headPos.z = newZ;
        else playBumpSound();
    }

    const perpX = -moveDir.z, perpZ = moveDir.x;
    let px = headPos.x - moveDir.x * HEAD_ATTACH;
    let pz = headPos.z - moveDir.z * HEAD_ATTACH;
    
    snakeCenter.set(0, 0, 0);
    let visibleCount = 0;
    
    for (let i = 0; i < MAX_SEGMENTS; i++) {
        const seg = segmentPositions[i];
        if (i === 0) {
            seg.x = px; seg.z = pz;
        } else {
            let dx = seg.x - px, dz = seg.z - pz;
            let len = Math.sqrt(dx*dx + dz*dz);
            if (len < 1e-6) { dx = -moveDir.x; dz = -moveDir.z; len = 1; }
            seg.x = px + (dx / len) * SEGMENT_SPACING;
            seg.z = pz + (dz / len) * SEGMENT_SPACING;
        }
        const pushed = pushSegmentOutOfWalls(seg.x, seg.z, baseRadii[i] * 1.15);
        seg.x = pushed.x; seg.z = pushed.z;
        px = seg.x; pz = seg.z;
        
        const mesh = snakeBody[i];
        mesh.visible = i < activeSegments;
        if (!mesh.visible) continue;
        
        const phase = i * 0.3 - elapsed * 2.5;
        const latOff = Math.sin(phase) * 0.04;
        const yOff = -0.45 + Math.sin(phase * 0.6 + i * 0.08) * 0.06;
        mesh.position.set(seg.x + perpX * latOff, yOff, seg.z + perpZ * latOff);
        snakeCenter.x += mesh.position.x;
        snakeCenter.z += mesh.position.z;
        visibleCount++;
    }
    
    if (visibleCount > 0) {
        snakeCenter.divideScalar(visibleCount);
        snakeCenter.lerp(headPos, 0.55);
    }

    head.position.set(headPos.x, -0.35, headPos.z);
    head.rotation.y = Math.PI / 2 - dirAngle;
    head.rotation.x = 0;

    const camHeight = Math.max(28, 22 + activeSegments * 0.5);
    const camDist = Math.max(18, 14 + activeSegments * 0.4);
    _cameraOffset.set(0, camHeight, camDist);

    _desiredCamPos.copy(snakeCenter).add(_cameraOffset);
    camera.position.lerp(_desiredCamPos, 0.08);
    cameraTarget.lerp(snakeCenter, 0.08);
    controls.target.copy(cameraTarget);

    controls.update();
    renderer.render(scene, camera);
}

window.showPage = function(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    const canvas = document.querySelector('canvas');
    if (canvas) {
        if (pageId === 'page-game') {
            canvas.style.display = 'block';
            canvas.classList.add('game-active');
        } else {
            canvas.style.display = 'none';
            canvas.classList.remove('game-active');
        }
    }
    const page = document.getElementById(pageId);
    if (page) page.scrollTop = 0;
};

window.finishGame = function(reason) {
    if (gameOver) return;
    gameOver = true;
    isGameActive = false;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    
    const t = translations[currentLang];
    const label = document.getElementById('result-label');
    const emoji = document.getElementById('result-emoji');
    const winBlock = document.getElementById('win-block');
    const loseBlock = document.getElementById('lose-block');
    
    if (reason === 'win') {
        label.textContent = t.resultWinLabel;
        label.style.color = "#0a8a4a";
        emoji.textContent = "🐍";
        emoji.className = "result-emoji snake-reward";
        document.getElementById('reward-text').textContent = t.rewardText;
        document.getElementById('result-text-win').textContent = t.resultWinText;
        winBlock.style.display = 'block';
        loseBlock.style.display = 'none';
        startConfetti();
    } else {
        label.textContent = t.resultTimeLabel;
        label.style.color = "#5a7a9a";
        emoji.textContent = "⏱";
        emoji.className = "result-emoji";
        document.getElementById('result-text-lose').textContent = t.resultTimeText;
        speakText('ttsTime');
        winBlock.style.display = 'none';
        loseBlock.style.display = 'block';
    }
    showPage('page-result');
};

let _starting = false;
window.startGame = function() {
    if (_starting) return;
    _starting = true;
    setTimeout(() => { _starting = false; }, 600);

    unlockTTS();
    initAudio();

    gameTimeLeft = MAX_TIME;
    updateTimerDisplay();
    speedMult = 1.0;
    isGameActive = true;
    gameOver = false;
    activeSegments = 35;

    const startPos = generateMaze();
    headPos.set(startPos.startX, 0, startPos.startZ);
    dirAngle = Math.PI / 2;
    targetAngle = Math.PI / 2;
    moveDir.x = Math.cos(dirAngle);
    moveDir.z = Math.sin(dirAngle);
    
    for (let i = 0; i < MAX_SEGMENTS; i++) {
        const d = HEAD_ATTACH + i * SEGMENT_SPACING;
        segmentPositions[i].set(headPos.x - moveDir.x * d, 0, headPos.z - moveDir.z * d);
        snakeBody[i].visible = i < activeSegments;
    }

    controls.target.copy(headPos);
    camera.position.copy(headPos).add(_cameraOffset);

    if (timerInterval) clearInterval(timerInterval);
    startTimer();

    const canvas = document.querySelector('canvas');
    if (canvas) {
        canvas.style.display = 'block';
        canvas.classList.add('game-active');
    }
    showPage('page-game');
    setTimeout(() => speakText('ttsStart'), 400);
};

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// ===== Фон/видимость: экономия батареи + восстановление TTS =====
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        isPaused = true;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
        isPaused = false;
        if (!rafId) rafId = requestAnimationFrame(animate);
        if (audioCtx && audioCtx.state === 'suspended') {
            try { audioCtx.resume(); } catch(e) {}
        }
        // Safari может потерять доступ к TTS — сбрасываем и разблокируем
        ttsUnlocked = false;
        unlockTTS();
    }
});

updateLanguage();

document.getElementById('txt-startBtn').addEventListener('click', function(e) {
    e.preventDefault();
    startGame();
});

rafId = requestAnimationFrame(animate);
console.log('✅ Игра "Змея и Лабиринт" готова. Режим:', IS_LOW_END ? 'облегчённый' : 'полный',
    '| Мобильное:', isMobile, '| Озвучка разблокируется при первом касании. Кнопка "🔊 Проверить голос" для теста.');
</script>
